[[section]]
title = "Research"

  [[section.entry]]
  when  = "Oct 2025 — now"
  what  = "Dissonant Affect: An Immersive Affective News System for Media Bias Cognition"
  where = "RMIT University — independent project"
  note  = "A VR affective news system asking whether immersive interaction can support critical thinking about media bias rather than only amplifying empathy. Proposes affective-semantic dissonance as a design pattern, using conflict between AI-analysed emotional tone and apparently neutral framing to expose hidden bias. Three-group between-subjects study: webpage baseline, 2D AI-text baseline, and the VR system."

