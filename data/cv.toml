#  在线简历 —— 依据 CV_Ziyuan_Qu.pdf 填写
#
#  没有收录的内容（有意为之）：
#   · 手机号 —— 不建议放在公开网页上，会被爬虫抓去发垃圾信息
#   · GPA / WAM —— 在线简历一般不列，需要的人会看 PDF 版
#  两者都还在你的 PDF 里，网页版只做索引。
#
#  logo 来源：RMIT / Aalto / Monash 用各校官网的 apple-touch-icon，
#  SZTU 用官网 SVG 校徽，Exertion Games Lab 用站点图标，
#  腾讯 / 网易用 Wikimedia 上的官方矢量标识。
#  SZTU 与网易的 SVG 都裁过 viewBox，只保留徽章/图形标，去掉了文字部分——
#  40px 的格子里带文字的横向长条标会缩到几像素高，完全读不出来。
#
#  logo_invert_dark 的判断依据是【实际对比度】而不是亮度：
#  饱和色（RMIT 红 3.8:1、网易红 3.2:1）在深底上靠色相就够看；
#  近中性的深色（腾讯黑 1.2:1、SZTU 深蓝 1.7:1）才需要反相。
#  invert(1) + hue-rotate(180deg) 只翻明度、保留色相。
# ─────────────────────────────────────────────────────────────

