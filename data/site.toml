# ── Research Interests ─────────────────────────────────────
# 首页 bio 下面的独立一段。留空则整块不渲染。
# 注意：这段和 bio 第二段主题重叠，加粗刻意错开——
# bio 里强调研究问题，这里强调研究领域，扫读时信息互补而不是重复。
research_interests = """
My research explores <strong>embodied interaction, extended reality, and wearable and ubiquitous sensing</strong>. I am particularly interested in how people adapt their movement and bodily strategies when the relationship between their actions and interactive environments changes. Building on this, I explore how sensing, haptics, and physical–digital interfaces can make interactive systems more responsive to users' behavior and bodily states. More broadly, I aim to design and study human-centered technologies that connect perception, action, and the physical environment across immersive and everyday contexts.
"""

