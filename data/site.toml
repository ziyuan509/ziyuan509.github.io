[site]
# 用发表署名的写法，跟 Google Scholar / 论文上的 "Qu, Z." 对得上。
# 想在站上带出英文名的话，改成 "Ziyuan (Bryce) Qu" 即可——
# 但注意 publications.toml 里 authors 数组中你自己的名字要跟这里完全一致才会自动加粗。
name        = "Ziyuan Qu"
# 显示在姓名旁边的小字。学术圈更常见的写法是 "he/him"（主格/宾格），
# 你要的 "he/his" 也有人用，改这里一处即可；留空则不显示。
pronouns    = "he/his"
role        = "Master of Design Innovation and Technology"
affiliation = "RMIT University"
affiliation_url = "https://www.rmit.edu.au"
email       = "ziyuan.qu@student.rmit.edu.au"
location    = "Melbourne, Australia"
photo       = "assets/img/profile.jpg"          # ⚠ 放一张方形照片到这个路径

base_url    = ""
url         = "https://ziyuanqu.dev"

description = "Ziyuan Qu — HCI and interaction design researcher at RMIT University, working on affective interaction, immersive systems, and playful embodied experiences."

footer_note = "Built by hand. No trackers."

# 首页自我介绍，一段一条，支持行内 HTML
bio = [
  "Master's student in Design Innovation and Technology at <a href=\"https://www.rmit.edu.au\">RMIT University</a>, Melbourne, currently visiting Monash University's <a href=\"https://exertiongameslab.org\">Exertion Games Lab</a>. I also go by Bryce.",
  "I work between HCI and interaction design, on turning a system's <strong>emotional and physiological signals</strong> into something a person can see, question, or act on. Before Melbourne: industrial design in Shenzhen, game UX at NetEase, user research at Tencent, and a small company building educational robotics.",
]

