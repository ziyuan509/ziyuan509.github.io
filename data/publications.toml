[[pub]]
title      = "Pacing the Tutorial: How Information Density Shapes Early Player Understanding"
authors    = ["Ziyuan Qu", "A. Collaborator", "Someone Advisor"]
venue      = "CHI"
venue_full = "ACM CHI Conference on Human Factors in Computing Systems"
year       = 2026
award      = "Best Paper Honorable Mention"
selected   = true
thumb      = ""
links      = { pdf = "#", doi = "#", code = "#", video = "#" }
abstract   = """
Tutorials are often treated as a single delivery of information, but player understanding is
built in batches. In a 32-participant study we compare three pacing schemes and measure their
effect on early input accuracy and subjective load. Splitting the same amount of information
into more, shorter batches significantly lowers cognitive load, at the cost of a longer overall
time to proficiency. We propose a simple model relating batch size to the mastery curve.
"""
bibtex     = """
@inproceedings{qu2026pacing,
  title     = {Pacing the Tutorial: How Information Density Shapes Early Player Understanding},
  author    = {Qu, Ziyuan and Collaborator, A. and Advisor, Someone},
  booktitle = {Proceedings of the CHI Conference on Human Factors in Computing Systems},
  year      = {2026},
  publisher = {ACM}
}
"""

