authors    = ["B. Coauthor", "Ziyuan Qu", "Someone Advisor"]
venue      = "UIST"
venue_full = "ACM Symposium on User Interface Software and Technology"
year       = 2025
selected   = true
thumb      = ""
links      = { pdf = "#", page = "#", code = "#" }
abstract   = """
Level editors tend to trade approachability against sufficiency. We interviewed 14 senior level
designers about how they route around the simplifying assumptions their tools make, and how they
take complexity back into their own hands. We report four recurring workaround patterns.
"""
