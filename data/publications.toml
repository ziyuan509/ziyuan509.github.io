[[pub]]
title      = "From One-Time Choices to Future Behavior: Revising Privacy Rules for AI Assistants in Shared Spaces"
authors    = ["Ziyuan Qu", "Jiaxi Hu", "Zhiqi Gao"]
venue      = "UbiComp Companion"
venue_full = "Companion of the 2026 ACM International Joint Conference on Pervasive and Ubiquitous Computing · Shanghai, China · 11–15 October 2026"
year       = 2026
month      = 10
award      = "To appear"
selected   = true
thumb      = "assets/img/pubs/privacy-rules.jpg"
# ⚠ DOI 10.1145/3798063.3837404 目前在 doi.org 返回 404、Crossref 也无记录——
#    会议还没开、论文集尚未发布。10 月之后把 doi 加回下面这行即可。
links      = { pdf = "assets/papers/privacy-rules-ubicomp26.pdf" }
abstract   = """
An AI assistant in a shared room hears people who never asked to be recorded. Our prototype lets the
primary user set privacy rules and decide, in the moment, whether a bystander's remark may be used —
then either confine that decision to the current event or save it as a rule for later ones. A
five-participant formative walkthrough found everyone could complete the decision, but two could not
tell which future situations their saved rule would cover. The lesson is specific: when someone saves
a privacy rule, its future reach has to be visible at the moment of saving.
"""

[[pub]]
title      = "Mapping the Landscape of Affective Extended Reality: A Scoping Review of Biodata-Driven Systems for Understanding and Sharing Emotions"
authors    = ["Zhidian Lin", "Allison Jing", "Ziyuan Qu", "Fabio Zambetta", "Ryan M. Kelly"]
venue      = "CHI"
venue_full = "ACM CHI Conference on Human Factors in Computing Systems · Barcelona, Spain · 13–17 April 2026"
year       = 2026
month      = 4
award      = "Honorable Mention"
selected   = true
thumb      = "assets/img/pubs/affective-xr.jpg"
links      = { pdf = "assets/papers/affective-xr-chi26.pdf", doi = "https://doi.org/10.1145/3772318.3791012" }
abstract   = """
Introduces affective extended reality as a way to characterise XR systems that use biodata to make
emotion understandable. HCI has produced many such systems, but they had not been mapped into a
coherent whole. We reviewed 82 papers at the intersection of biodata, emotion and XR, analysing the
sensing technologies they rely on, the interaction techniques they employ, and the design space they
collectively describe.
"""

[[pub]]
title      = "Beyond the Screen: Passive Peripheral Touch for Reducing Occlusion in Mobile Interaction"
authors    = ["Ziyuan Qu", "Yibo Meng", "B. Liu", "Yan Guan"]
venue      = "CHI Workshop"
venue_full = "Cross-Sensory Futures: Rewiring Perception in HCI — Workshop at ACM CHI 2026 · Barcelona, Spain · April 2026"
year       = 2026
month      = 4
award      = "Accepted"
selected   = true
thumb      = "assets/img/projects/touch-it.jpg"
abstract   = """
A passive, battery-free accessory that moves the finger off the screen. Metal tines act as extended
electrodes so taps and swipes still register while the hand stops covering what the user is trying
to read.
"""

[[pub]]
title      = "Companion Animal Emotion and Health Status Monitoring Based on Wearable Multimodal Sensing"
authors    = ["Yibo Meng", "Ziyuan Qu", "Yan Guan"]
venue      = "UbiComp/ISWC Companion"
venue_full = "Companion of the 2025 ACM International Joint Conference on Pervasive and Ubiquitous Computing and the 2025 ACM International Symposium on Wearable Computers · Espoo, Finland · 12–16 October 2025"
year       = 2025
month      = 10
award      = "Poster · Equal contribution"
selected   = false
thumb      = "assets/img/pubs/companion-animal.jpg"
links      = { pdf = "assets/papers/companion-animal-ubicomp25.pdf" }
abstract   = """
Judging how a dog feels usually depends on subjective observation. This non-invasive wearable system
combines electrodermal activity, photoplethysmography, inertial sensing and audio, and applies machine
learning to separate three states — excitement, anxiety and relaxation — at 78.5% accuracy. A low-cost
starting point for ubiquitous animal-computer interaction.
"""
