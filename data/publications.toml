[[pub]]
title      = "From One-Time Choices to Future Behavior: Revising Privacy Rules for AI Assistants in Shared Spaces"
authors    = ["Ziyuan Qu", "J. Hu", "Z. Gao"]
venue      = "UbiComp Companion"
venue_full = "Companion of the 2026 ACM International Joint Conference on Pervasive and Ubiquitous Computing"
year       = 2026
selected   = true
thumb      = ""
links      = { doi = "https://doi.org/10.1145/3798063.3837404" }
abstract   = """
An editable privacy-rule interface for shared-space AI assistants, letting people manage
bystander-related information across both immediate decisions and scoped future rules. A
five-participant formative walkthrough surfaced ambiguity in how a saved rule applies to later
situations, motivating explicit presentation of rule scope and future effects.
"""

