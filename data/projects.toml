# ─────────────────────────────────────────────────────────────
#  作品 / 项目 —— 暂时留空，等你挑好要展示的再填
#
#  Projects 落地页是一列到底的大图长条（桌面 944×472，2:1），
#  目的是让人一眼看清做的是什么，所以【配图比文字重要】。
#  没有 image 的条目会显示一个带首字母的大灰块。
#
#  字段说明
#    name      项目名
#    tagline   一两句话说清它是什么、你做了什么
#    kind      "game" | "tool" | "research" | "other"，用于分组标题
#    year      字符串，显示在标题旁
#    role      你在其中的角色
#    tags      技术栈或关键词
#    image     assets/img/ 下的路径，2:1 比例最佳
#    featured  true 的会出现在首页的三格预览
#    links     inline table，键名就是按钮上的字，顺序即显示顺序
#
#  照着这个格式往下加就行：
#
#  [[project]]
#  name     = "Dissonant Affect"
#  tagline  = "A VR affective news system that surfaces hidden emotional bias..."
#  kind     = "research"
#  year     = "2025"
#  role     = "Design · Study · Build"
#  tags     = ["Unity", "VR", "Research through design"]
#  image    = "assets/img/projects/dissonant-affect.jpg"
#  featured = true
#  links    = { page = "#", video = "#", code = "#" }
#
#  几个现成的候选（都来自你的 CV，值得做成条目）：
#   · Dissonant Affect —— VR 情感新闻系统（research）
#   · Beyond the Screen —— 被动外围触控配件（research，CHI Workshop）
#   · Companion Animal Monitoring —— 可穿戴多模态感知（research）
#   · 教育机器人 / ROS 智能小车 —— 你自己公司的产品（other）
#   · Aalto 期间的 Unity 原型 —— 如果有能公开的（game）
# ─────────────────────────────────────────────────────────────
