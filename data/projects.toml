[[project]]
slug     = "theta"
name     = "Theta"
tagline  = "A 3D puzzle game built on ring-based music puzzles. I designed and implemented the whole interface."
kind     = "game"
year     = "2026"
role     = "UI Design · Implementation · Deployment"
tags     = ["Game UI", "Diegetic interface", "Team project"]
image    = "assets/img/projects/theta.jpg"
card     = "assets/img/projects/theta-card.jpg"
featured = true
links    = { play = "https://c14chan.itch.io/theta" }
lead     = """
A 3D puzzle game about a researcher who vanished on a remote island. The story is told through what
the mountain laboratory left behind, and the puzzles are rings — circular arrangements rooted in group
theory that you solve by learning the songs of the animals around you. Each solution pulls the world
further out of silence and back toward colour. I was responsible for the interface end to end: design,
implementation, and deployment.
"""
facts = [
  { icon = "display", label = "My role",   value = "Sole owner of UI design and implementation" },
  { icon = "people",  label = "Team",      value = "Seven credited authors, plus wider contributors" },
  { icon = "layers",  label = "Puzzle",    value = "Ring structures grounded in group theory" },
  { icon = "hand",    label = "Input",     value = "Keyboard, mouse and controller, one layout" },
]

  [[project.section]]
  heading = "Teaching controls without leaving the world"
  body = """
The game asks players to hold three things at once: movement, direct interaction with animals, and a
puzzle layer with its own verbs. A conventional key-list screen would have flattened all of that into
one undifferentiated wall of bindings. Instead the guide groups controls by <em>what they are for</em> —
movement, interaction, puzzle actions — and lights each cluster as the player exercises it, so the
screen doubles as a check that the input actually arrived. It also carries keyboard and controller
bindings in the same layout rather than in separate screens, because the two are not alternative modes
so much as alternative hands.
"""
  video = "assets/video/theta-tutorial.mp4"
  poster = "assets/img/projects/theta-tutorial-poster.jpg"
  caption = "The operation guide: controls grouped by purpose, each lighting up as it is used."

  [[project.section]]
  heading = "A radial menu that keeps the world visible"
  body = """
Settings sit on a ring rather than in a stack. The shape is not decoration — it echoes the circular
logic of the puzzles, and more practically it keeps the options within a single thumb or wrist sweep
instead of a vertical scan. The centre stays open, so the scene behind the menu is never fully occluded
and the player does not lose their place in the world while adjusting audio.
"""
  video = "assets/video/theta-settings.mp4"
  poster = "assets/img/projects/theta-settings-poster.jpg"
  caption = "Radial settings: one sweep to reach any option, the world still legible behind it."

  [[project.section]]
  heading = "Making the puzzle readable"
  body = """
The ring puzzles are the part players get stuck on, and almost always because they cannot see the
structure rather than because the structure is hard. The interface work here was about surfacing state:
which positions are filled, which are still open, and what the ring is doing in response to an input.
Feedback is immediate and local — the element you touched responds before anything else does — so cause
and effect stay attached to each other.
"""
  video = "assets/video/theta-bird.mp4"
  poster = "assets/img/projects/theta-bird-poster.jpg"
  caption = "A ring puzzle in play, with the animal whose song it encodes."


[[project]]
slug     = "was-here"
name     = "Was Here: From Presence to Trace"
tagline  = "A projection installation that holds one motion signal constant and varies how it is represented four times."
kind     = "installation"
year     = "2025"
role     = "Concept · Algorithms · Fabrication"
tags     = ["Projection", "Computer vision", "Passive interaction"]
image    = "assets/img/projects/was-here.jpg"
card     = "assets/img/projects/was-here-card.jpg"
featured = true
lead     = """
An interactive projection installation in a corridor at RMIT that people walk through rather than stop
in. Four adjacent frames read the same motion signal and represent it four different ways — a live
silhouette, a data trail, a mark on the environment, and an anonymous flow. Watching them left to right
is watching a person be progressively abstracted by the system that noticed them.
"""
facts = [
  { icon = "sensing", label = "Input",    value = "Camera motion capture, single shared signal" },
  { icon = "layers",  label = "Output",   value = "Four representations of that one signal" },
  { icon = "hand",    label = "Consent",  value = "Passive — no dwell, no trigger, no opt-in" },
  { icon = "place",   label = "Setting",  value = "A through-route, not a destination" },
]

  [[project.section]]
  heading = "Holding the input constant, varying the representation"
  body = """
The design move is a controlled comparison. All four frames consume the same camera-derived motion
signal; what changes between them is only how that signal is rendered. The first is indexical — a
silhouette that maps one-to-one onto the body and fades after a few seconds. The second abstracts to
trajectory: the person becomes a trail. The third records an effect on the environment that persists
after the person has gone. The fourth aggregates, and the individual stops being recoverable at all.
<br><br>
Because the input never changes, the difference a viewer feels between frame one and frame four is
attributable entirely to representation. That is the argument the piece is making: how a system chooses
to depict you determines whether you remain a person in it.
"""
  image = "assets/img/projects/was-here-frames.jpg"
  caption = "The four frames. Same signal, four levels of abstraction."

  [[project.section]]
  heading = "Designing for walking pace"
  body = """
In a corridor nobody stops, so latency — not resolution — set the constraints. A silhouette is only
legible as <em>yours</em> if it appears while you are still in front of the frame; a few hundred
milliseconds late and it reads as someone else's. That pushed the projector above the window for throw
distance and put the camera at the base of the second window, capturing at walking height rather than
overhead, so the detection region matched the strip of floor a person actually crosses.
"""
  image = "assets/img/projects/was-here-plan.jpg"
  caption = "Projector and camera placement, with the capture and projection volumes mapped onto the site."

  [[project.section]]
  heading = "Passive interaction and the question of consent"
  body = """
Nothing here asks permission. That is deliberate and uncomfortable in the way it is meant to be: the
piece reproduces the condition it is about, which is being sensed by infrastructure you did not opt
into. The four frames give that condition a legible shape — you can watch yourself become a silhouette,
then a trail, then a statistic, in the time it takes to walk past.
"""


[[project]]
slug     = "telepathic-jar"
name     = "Telepathic Jar"
tagline  = "Two networked bottles that translate remote weather into light and mist instead of numbers."
kind     = "installation"
year     = "2025"
role     = "Concept · Hardware · Firmware"
tags     = ["IoT", "ESP32", "MQTT", "Calm technology"]
image    = "assets/img/projects/telepathic-jar.jpg"
card     = "assets/img/projects/telepathic-jar-card.jpg"
featured = true
links    = { video = "https://youtu.be/Q9m8JZQBXWs" }
lead     = """
Two bottles in two places. Each senses the weather where it stands and renders the other's conditions
as colour, brightness and mist. Nothing is ever displayed as a number — the design question is what a
system should <em>withhold</em> in order to stay in peripheral attention rather than demanding it.
"""
facts = [
  { icon = "hardware", label = "Hardware", value = "ESP32-S3 · BME280 · BH1750 · NeoPixel ring · nebuliser" },
  { icon = "sensing",  label = "Transport", value = "MQTT over TLS, symmetric publish/subscribe" },
  { icon = "code",     label = "Sources",  value = "Local sensors plus a live weather API" },
  { icon = "display",  label = "Rendering", value = "Colour, brightness, mist density" },
]

  [[project.section]]
  heading = "One firmware, two roles"
  body = """
Both jars run identical firmware. What differentiates them is two strings set through a web
configuration portal on first boot: its own device ID and its partner's. Every MQTT topic is derived
from those, so jar A publishes to <code>telepathic_jar/JarA/data</code> and subscribes to
<code>telepathic_jar/JarB/data</code>, and the pairing is symmetric by construction rather than by
configuration discipline. Adding a third jar would mean changing the topic scheme, not the code that
reads sensors.
"""
  code = """float temp  = bme.readTemperature();
float hum   = bme.readHumidity();
float light = lightMeter.readLightLevel();

mqttClient.publish(topic_publish_p2p_data.c_str(), output_json.c_str());
mqttClient.subscribe(topic_subscribe_p2p_data.c_str());"""
  code_lang = "The read-and-publish loop, from the project write-up"
  image = "assets/img/projects/telepathic-jar-circuit.jpg"
  caption = "One jar's stack: environmental sensing, a controller, a light ring and a nebuliser."

  [[project.section]]
  heading = "Curating the mapping, not reporting the data"
  body = """
The system never shows a reading. Which colours the light is allowed to take, how bright it may get,
and what makes the nebuliser fire are all authored decisions that map temperature, humidity, pressure,
ambient light and live weather onto an atmosphere. Weather text from the API is matched to a base hue
before temperature adjusts it, so <em>rain</em> and <em>cold rain</em> are related but distinguishable.
The constraint that mattered was restraint: enough resolution to feel a change, not enough to invite
reading it as a measurement.
"""
  image = "assets/img/projects/telepathic-jar-built.jpg"
  caption = "The finished pair, one lit from the internal ring."

  [[project.section]]
  heading = "Ambient systems have to make failure legible"
  body = """
The first firmware reconnected silently whenever the link dropped, which produced the worst possible
ambiguity for a calm-technology object: a jar sitting quietly could mean <em>it is calm where they
are</em> or <em>the connection is gone</em>. Those are opposite messages rendered identically. The
shipped version adds periodic reconnection with explicit status reporting, so an unreachable partner
looks different from a peaceful one. For a device whose whole point is being glanced at rather than
read, an unreadable failure state is not a minor bug.
"""


[[project]]
slug     = "touch-it"
name     = "TOUCH IT!"
tagline  = "A passive accessory that moves the contact point off the screen so your hand stops hiding the target."
kind     = "device"
year     = "2024"
role     = "Hardware · Software · UX"
tags     = ["Swift", "Capacitive sensing", "Mobile interaction"]
image    = "assets/img/projects/touch-it.jpg"
card     = "assets/img/projects/touch-it-card.jpg"
featured = true
lead     = """
Metal tines, laid out like a kalimba, act as extended electrodes against a touchscreen. A tap or a
swipe across them still registers, but the hand never crosses the display. No battery, no pairing,
nothing to charge. The work became a CHI 2026 workshop paper.
"""
facts = [
  { icon = "hand",     label = "Problem",   value = "Occlusion is an input error, not just a view one" },
  { icon = "hardware", label = "Hardware",  value = "Linear electrodes on insulated PET, unpowered" },
  { icon = "code",     label = "Software",  value = "Swift / UIKit gesture prototype" },
  { icon = "sensing",  label = "Principle", value = "Extending the capacitive contact off-screen" },
]

  [[project.section]]
  heading = "Occlusion is an input problem"
  body = """
The obvious cost of a finger on glass is that it hides what is underneath. The less obvious one is that
it corrupts the input itself: a finger covering a key disturbs capacitive sensing, the detected centroid
shifts, and the system resolves to the wrong target. That is why <em>bucket</em> comes out as
<em>bucked</em> — k and l are adjacent, and the contact patch straddles both. Treating this as a display
problem leads to bigger targets. Treating it as an input problem leads to moving the contact.
"""

  [[project.section]]
  heading = "Encoding direction in the electrode geometry"
  body = """
A capacitive screen needs a fingertip-sized conductor on its surface, so the accessory supplies one —
just not the finger. Several linear electrodes contact the glass while the hand rests off to the side,
and their spacing and width do the work of encoding a gesture: sliding across tines of one pitch reads
as a vertical swipe, across another as horizontal. The narrow segment sits under the finger, the wider
one against the screen, with an insulating layer keeping the two touch surfaces from shorting into a
single ambiguous blob.
"""
  image = "assets/img/projects/touch-it-mapping.jpg"
  caption = "How the geometry maps to gestures, and which segment goes where."

  [[project.section]]
  heading = "Disambiguating tap from drag, and the platform limit"
  body = """
The iOS prototype is written in Swift on UIKit. Gesture recognition classifies the incoming signal into
tap or swipe against a threshold, a cursor is drawn where the contact resolves, and a stored previous
position carries the cursor across gestures so a swipe resumes where the last one ended rather than
snapping back. The honest limit is the platform: a genuinely system-wide emulated pointer needs a
jailbroken device, so the prototype demonstrates the interaction inside its own application rather than
across iOS.
"""
  image = "assets/img/projects/touch-it-software.jpg"
  caption = "The software prototype running against the physical accessory."


[[project]]
slug     = "dislocation"
name     = "Dislocation Communication"
tagline  = "A two-player game that turns a therapy model into something you operate rather than read about."
kind     = "game"
year     = "2024"
role     = "UX Design · Game Design · Research"
tags     = ["Unreal Engine", "Narrative design", "Mental health"]
image    = "assets/img/projects/dislocation.jpg"
card     = "assets/img/projects/dislocation-card.jpg"
featured = true
links    = { video = "https://youtu.be/l0Uwg_d7UwY" }
lead     = """
An emotional narrative game for a parent and a child in a single-parent family, built on the Satir
family therapy model. One player describes a real conflict; the other has to investigate what sits
underneath it. The interaction design question was how to make somebody else's interior state into
something you actively probe rather than something you assume.
"""
facts = [
  { icon = "people",  label = "Players",   value = "Two, asymmetric roles, played together online" },
  { icon = "layers",  label = "Model",     value = "Satir iceberg, as an interaction not a metaphor" },
  { icon = "display", label = "Feedback",  value = "World state, not score" },
  { icon = "time",    label = "Structure", value = "Three chapters" },
]

  [[project.section]]
  heading = "Turning the iceberg into an instrument"
  body = """
Satir's iceberg holds that beneath surface emotions — anger, withdrawal — sit unmet longings for safety,
recognition, belonging. As a diagram it is something you nod at. The game makes it operable: one player
describes an event, the system produces a layered reading of it, and the other player uses an
<em>iceberg searchlight</em> to step down through surface emotion, to the layer beneath, to the longing
at the bottom.
<br><br>
The design claim is in the verb. Reading a description of someone's feelings is passive and easy to
skip; having to aim an instrument at each layer in turn makes the other person's interior state a thing
you investigate. Comprehension becomes an action with a cost, which is what makes it register.
"""
  image = "assets/img/projects/dislocation-iceberg.jpg"
  caption = "The iceberg searchlight: surface emotion, layered emotion, and the longing underneath."

  [[project.section]]
  heading = "Asymmetry as the mechanism"
  body = """
The two players never hold the same information. One authors the event, the other interrogates it, and
they swap. That asymmetry is the point — it reproduces the actual condition of the relationship, where
each side has privileged access to their own experience and none to the other's, and it forces the
exchange the game exists to produce. A symmetric design would have let both players stay in their own
account of what happened.
"""

  [[project.section]]
  heading = "Repair as state rather than score"
  body = """
Progress is not a number. Completing a chapter's challenge restores the scene: a room that began damaged
is put back together. Using world state as the readout means neither player is told they did well —
they see it, in a shared space they both occupy. It also avoids the failure mode of scoring an emotional
exchange, which would have made the game something you can lose at.
"""
  image = "assets/img/projects/dislocation-restore.jpg"
  caption = "Before and after: the space carries the progress."
