[[project]]
name     = "Was Here: From Presence to Trace"
tagline  = "An interactive projection installation in an RMIT corridor. Four frames trace how a passing body registers in digital systems — a live silhouette, a data trail, a mark on the environment, and finally an anonymous flow of information. Nobody has to stop or press anything; walking through is the whole interaction."
kind     = "installation"
year     = "2025"
role     = "Concept · Algorithms · Fabrication"
tags     = ["Projection", "Computer vision", "Passive interaction", "MDF"]
image    = "assets/img/projects/was-here.jpg"
featured = true

[[project]]
name     = "Telepathic Jar"
tagline  = "A pair of IoT bottles that sense the weather where each person is and translate it into light and mist. Instead of showing raw sensor readings, it curates them — colour, brightness and fog become a quiet way to feel that someone far away is having a grey afternoon. Built on ESP32 with MQTT over TLS."
kind     = "installation"
year     = "2025"
role     = "Concept · Hardware · Firmware"
tags     = ["IoT", "ESP32", "MQTT", "Calm technology"]
image    = "assets/img/projects/telepathic-jar.jpg"
featured = true
links    = { video = "https://youtu.be/Q9m8JZQBXWs" }

[[project]]
name     = "Dislocation Communication"
tagline  = "A two-player narrative game for parents and children in single-parent families, built on the Satir family therapy model. One player describes a real conflict; the other uses an \"iceberg searchlight\" to read the layers of feeling underneath it. Repairing the room is how the game marks that you understood each other."
kind     = "game"
year     = "2024"
role     = "UX Design · Game Design · Research"
tags     = ["Unreal Engine", "Narrative design", "Mental health"]
image    = "assets/img/projects/dislocation.jpg"
featured = true
links    = { video = "https://youtu.be/l0Uwg_d7UwY" }

[[project]]
name     = "TOUCH IT!"
tagline  = "A passive, battery-free accessory that moves your finger off the screen. Borrowing the layout of a kalimba, metal tines act as extended electrodes so taps and swipes register without your hand covering what you are trying to read. The companion iOS prototype is written in Swift, with a threshold that separates a tap from a drag."
kind     = "device"
year     = "2024"
role     = "Hardware · Software · UX"
tags     = ["Swift", "Hardware prototyping", "Occlusion", "Mobile interaction"]
image    = "assets/img/projects/touch-it.jpg"
featured = true
