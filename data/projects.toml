lead     = """
A 3D puzzle game about a researcher who vanished on a remote island. The story is told through what
the mountain laboratory left behind, and the puzzles are rings — circular arrangements rooted in group
theory that you solve by learning the songs of the animals around you. Each solution pulls the world
further out of silence and back toward colour. I was responsible for the interface end to end: design,
implementation, and deployment.
"""
facts = [
  { icon = "display", label = "My role",   value = "Sole owner of UI design and implementation" },
  { icon = "people",  label = "Team",      value = "Seven credited authors, plus wider contributors" },
  { icon = "layers",  label = "Puzzle",    value = "Ring structures grounded in group theory" },
  { icon = "hand",    label = "Input",     value = "Keyboard, mouse and controller, one layout" },
]

  [[project.section]]
  heading = "Teaching controls without leaving the world"
  body = """
The game asks players to hold three things at once: movement, direct interaction with animals, and a
puzzle layer with its own verbs. A conventional key-list screen would have flattened all of that into
one undifferentiated wall of bindings. Instead the guide groups controls by <em>what they are for</em> —
movement, interaction, puzzle actions — and lights each cluster as the player exercises it, so the
screen doubles as a check that the input actually arrived. It also carries keyboard and controller
bindings in the same layout rather than in separate screens, because the two are not alternative modes
so much as alternative hands.
"""
  video = "assets/video/theta-tutorial.mp4"
  poster = "assets/img/projects/theta-tutorial-poster.jpg"
  caption = "The operation guide: controls grouped by purpose, each lighting up as it is used."

  [[project.section]]
  heading = "A radial menu that keeps the world visible"
  body = """
Settings sit on a ring rather than in a stack. The shape is not decoration — it echoes the circular
logic of the puzzles, and more practically it keeps the options within a single thumb or wrist sweep
instead of a vertical scan. The centre stays open, so the scene behind the menu is never fully occluded
and the player does not lose their place in the world while adjusting audio.
"""
  video = "assets/video/theta-settings.mp4"
  poster = "assets/img/projects/theta-settings-poster.jpg"
  caption = "Radial settings: one sweep to reach any option, the world still legible behind it."

  [[project.section]]
  heading = "Making the puzzle readable"
  body = """
The ring puzzles are the part players get stuck on, and almost always because they cannot see the
structure rather than because the structure is hard. The interface work here was about surfacing state:
which positions are filled, which are still open, and what the ring is doing in response to an input.
Feedback is immediate and local — the element you touched responds before anything else does — so cause
and effect stay attached to each other.
"""
  video = "assets/video/theta-bird.mp4"
  poster = "assets/img/projects/theta-bird-poster.jpg"
  caption = "A ring puzzle in play, with the animal whose song it encodes."


[[project]]
slug     = "was-here"
name     = "Was Here: From Presence to Trace"
tagline  = "A projection installation that holds one motion signal constant and varies how it is represented four times."
kind     = "installation"
year     = "2025"
role     = "Concept · Algorithms · Fabrication"
tags     = ["Projection", "Computer vision", "Passive interaction"]
image    = "assets/img/projects/was-here.jpg"
card     = "assets/img/projects/was-here-card.jpg"
featured = true
lead     = """
An interactive projection installation in a corridor at RMIT that people walk through rather than stop
in. Four adjacent frames read the same motion signal and represent it four different ways — a live
silhouette, a data trail, a mark on the environment, and an anonymous flow. Watching them left to right
is watching a person be progressively abstracted by the system that noticed them.
"""
facts = [
  { icon = "sensing", label = "Input",    value = "Camera motion capture, single shared signal" },
  { icon = "layers",  label = "Output",   value = "Four representations of that one signal" },
  { icon = "hand",    label = "Consent",  value = "Passive — no dwell, no trigger, no opt-in" },
  { icon = "place",   label = "Setting",  value = "A through-route, not a destination" },
]

  [[project.section]]
  heading = "Holding the input constant, varying the representation"
  body = """
The design move is a controlled comparison. All four frames consume the same camera-derived motion
signal; what changes between them is only how that signal is rendered. The first is indexical — a
silhouette that maps one-to-one onto the body and fades after a few seconds. The second abstracts to
trajectory: the person becomes a trail. The third records an effect on the environment that persists
after the person has gone. The fourth aggregates, and the individual stops being recoverable at all.
<br><br>
Because the input never changes, the difference a viewer feels between frame one and frame four is
attributable entirely to representation. That is the argument the piece is making: how a system chooses
to depict you determines whether you remain a person in it.
"""
  image = "assets/img/projects/was-here-frames.jpg"
  caption = "The four frames. Same signal, four levels of abstraction."

  [[project.section]]
  heading = "Designing for walking pace"
  body = """
In a corridor nobody stops, so latency — not resolution — set the constraints. A silhouette is only
legible as <em>yours</em> if it appears while you are still in front of the frame; a few hundred
milliseconds late and it reads as someone else's. That pushed the projector above the window for throw
distance and put the camera at the base of the second window, capturing at walking height rather than
overhead, so the detection region matched the strip of floor a person actually crosses.
"""
  image = "assets/img/projects/was-here-plan.jpg"
  caption = "Projector and camera placement, with the capture and projection volumes mapped onto the site."

  [[project.section]]
  heading = "Passive interaction and the question of consent"
  body = """
Nothing here asks permission. That is deliberate and uncomfortable in the way it is meant to be: the
piece reproduces the condition it is about, which is being sensed by infrastructure you did not opt
into. The four frames give that condition a legible shape — you can watch yourself become a silhouette,
then a trail, then a statistic, in the time it takes to walk past.
"""


