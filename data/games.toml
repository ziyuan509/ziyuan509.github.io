# ─────────────────────────────────────────────────────────────
#  游戏手记 —— 暂时留空
#
#  定位：不是评测，是"作为做游戏和研究交互的人，我从这一款里带走了什么"。
#  这是整个站里最能体现你个人视角的一页，也是最容易写出味道的一页。
#  每条建议 3–5 句，lesson 一句话说透设计上的启发。
#
#  字段说明
#    title     游戏名
#    platform  平台
#    year      发行年份
#    played    你玩的时间，字符串，怎么写就怎么显示
#    rating    0–5，渲染成五个小方块（不是星星）
#    cover     可选封面图，3:4 比例，桌面显示 72×96
#    tags      关键词，会拼在元信息行里
#    take      主体段落
#    lesson    可选，带竖线引出的那一句"带走的"。留空则不显示
#
#  照着这个格式往下加：
#
#  [[play]]
#  title    = "Outer Wilds"
#  platform = "PC"
#  year     = 2019
#  played   = "2026.07"
#  rating   = 5
#  cover    = ""
#  tags     = ["Exploration", "Time loop"]
#  take     = """
#  几句话，写你实际注意到的机制或设计决策。
#  """
#  lesson   = "一句话，写它对你自己的设计/研究有什么启发。"
# ─────────────────────────────────────────────────────────────
